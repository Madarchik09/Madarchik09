<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="snakeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#34D399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Left Card: GitHub Telemetry & Metrics -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="586" height="220" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">📊 GitHub Overview &amp; Agent Telemetry</text>
    <circle cx="552" cy="32" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(28, 58)">
      <rect x="0" y="0" width="254" height="64" rx="10" fill="#111827" stroke="#1E293B"/>
      <text x="16" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">PUBLIC &amp; PRIVATE REPOS</text>
      <text x="16" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" fill="#38BDF8">19</text>
      <text x="58" y="48" font-family="ui-monospace, monospace" font-size="11" fill="#34D399">Active</text>

      <rect x="274" y="0" width="256" height="64" rx="10" fill="#111827" stroke="#1E293B"/>
      <text x="290" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">SPECIALIZED AI AGENTS</text>
      <text x="290" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" fill="#818CF8">12</text>
      <text x="332" y="48" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">+ 49 Skills</text>

      <rect x="0" y="78" width="254" height="64" rx="10" fill="#111827" stroke="#1E293B"/>
      <text x="16" y="102" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">PRIMARY AI STACK</text>
      <text x="16" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="700" fill="#34D399">Gemini 4 • Claude • R1</text>

      <rect x="274" y="78" width="256" height="64" rx="10" fill="#111827" stroke="#1E293B"/>
      <text x="290" y="102" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">AUTOMATION CLUSTERS</text>
      <text x="290" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="700" fill="#F472B6">n8n • Supabase • Vercel</text>
    </g>
  </g>

  <!-- Right Card: Top Languages Distribution -->
  <g transform="translate(614, 0)">
    <rect x="0" y="0" width="586" height="220" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">💻 Most Used Languages &amp; Runtimes</text>

    <g transform="translate(28, 58)">
      <rect x="0" y="0" width="530" height="14" rx="7" fill="#1E293B"/>
      <rect x="0" y="0" width="212" height="14" rx="7" fill="#3178C6"/>
      <rect x="206" y="0" width="165" height="14" fill="#3572A5"/>
      <rect x="371" y="0" width="90" height="14" fill="#00ADD8"/>
      <rect x="461" y="0" width="69" height="14" rx="7" fill="#10B981"/>
    </g>

    <g transform="translate(28, 98)" font-family="ui-monospace, monospace" font-size="13">
      <circle cx="8" cy="8" r="5" fill="#3178C6"/>
      <text x="24" y="12" fill="#F8FAFC" font-weight="600">TypeScript / Next.js</text>
      <text x="215" y="12" fill="#94A3B8">40%</text>

      <circle cx="288" cy="8" r="5" fill="#3572A5"/>
      <text x="304" y="12" fill="#F8FAFC" font-weight="600">Python / FastAPI / AI</text>
      <text x="492" y="12" fill="#94A3B8">31%</text>

      <circle cx="8" cy="44" r="5" fill="#00ADD8"/>
      <text x="24" y="48" fill="#F8FAFC" font-weight="600">Go (LLM Gateways)</text>
      <text x="215" y="48" fill="#94A3B8">17%</text>

      <circle cx="288" cy="44" r="5" fill="#10B981"/>
      <text x="304" y="48" fill="#F8FAFC" font-weight="600">Shell / Docker / SQL</text>
      <text x="492" y="48" fill="#94A3B8">12%</text>

      <rect x="0" y="72" width="530" height="32" rx="8" fill="#111827" stroke="#1E293B"/>
      <text x="16" y="92" font-size="11.5" fill="#94A3B8">⚡ Focus: Autonomous Coding, Video Generation (Veo/Remotion), Telegram TMA</text>
    </g>
  </g>

  <!-- Bottom Full-Width Animated Contribution Matrix & Snake -->
  <g transform="translate(0, 244)">
    <rect x="0" y="0" width="1200" height="174" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">🐍 Contribution Matrix &amp; Activity Pulse</text>
    <text x="1025" y="34" font-family="ui-monospace, monospace" font-size="11.5" fill="#34D399">● ACTIVE PIPELINE</text>

    <!-- Grid: 52 cols x 4 rows, cell 16x16, step 22px. Centers at x = col*22 + 8, y = row*22 + 8 (8, 30, 52, 74) -->
    <g transform="translate(28, 52)">
      <pattern id="cells" width="22" height="22" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="16" height="16" rx="3.5" fill="#111827" stroke="#1E293B" stroke-width="0.8"/>
      </pattern>
      <rect x="0" y="0" width="1144" height="88" fill="url(#cells)"/>

      <!-- 24 Green Cells Placed Exactly on Every Node of the Snake Path & Eaten Sequentially -->
      <!-- Seg 1: y=30 (row 1, y=22), x=44 (col 2), x=88 (col 4), x=132 (col 6) -->
      <rect x="44" y="22" width="16" height="16" rx="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.04;0.06;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="88" y="22" width="16" height="16" rx="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.07;0.09;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="132" y="22" width="16" height="16" rx="3.5" fill="#059669">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.10;0.12;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>

      <!-- Seg 2: up to y=8 (row 0, y=0) at x=132, then right to x=198 (col 9), x=264 (col 12) -->
      <rect x="132" y="0" width="16" height="16" rx="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.12;0.14;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="198" y="0" width="16" height="16" rx="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.16;0.18;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="264" y="0" width="16" height="16" rx="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.20;0.22;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>

      <!-- Seg 3: down at x=264 to y=30 (y=22), y=52 (y=44), y=74 (y=66) -->
      <rect x="264" y="22" width="16" height="16" rx="3.5" fill="#059669">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.22;0.24;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="264" y="44" width="16" height="16" rx="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.24;0.26;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="264" y="66" width="16" height="16" rx="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.26;0.28;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>

      <!-- Seg 4: right on row 3 (y=66, cy=74) to x=352 (col 16), x=418 (col 19) -->
      <rect x="352" y="66" width="16" height="16" rx="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.31;0.33;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="418" y="66" width="16" height="16" rx="3.5" fill="#059669">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.36;0.38;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>

      <!-- Seg 5: up at x=418 to row 1 (y=22, cy=30) via row 2 (y=44) -->
      <rect x="418" y="44" width="16" height="16" rx="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.38;0.40;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="418" y="22" width="16" height="16" rx="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.40;0.42;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>

      <!-- Seg 6: right on row 1 (y=22, cy=30) to x=506 (col 23), x=594 (col 27) -->
      <rect x="506" y="22" width="16" height="16" rx="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.45;0.47;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="594" y="22" width="16" height="16" rx="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.51;0.53;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>

      <!-- Seg 7: down at x=594 to row 2 (y=44, cy=52), then right to x=682 (col 31), x=770 (col 35) -->
      <rect x="594" y="44" width="16" height="16" rx="3.5" fill="#059669">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.53;0.55;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="682" y="44" width="16" height="16" rx="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.58;0.60;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="770" y="44" width="16" height="16" rx="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.64;0.66;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>

      <!-- Seg 8: up at x=770 to row 0 (y=0, cy=8) via row 1 (y=22) -->
      <rect x="770" y="22" width="16" height="16" rx="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.66;0.68;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="770" y="0" width="16" height="16" rx="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.68;0.70;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>

      <!-- Seg 9: right on row 0 (y=0, cy=8) to x=880 (col 40), x=968 (col 44) -->
      <rect x="880" y="0" width="16" height="16" rx="3.5" fill="#059669">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.74;0.76;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="968" y="0" width="16" height="16" rx="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.79;0.81;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>

      <!-- Seg 10: down at x=968 to row 2 (y=44, cy=52) via row 1 (y=22), then right to x=1056 (col 48), x=1122 (col 51) -->
      <rect x="968" y="22" width="16" height="16" rx="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.81;0.83;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="968" y="44" width="16" height="16" rx="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.83;0.85;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="1056" y="44" width="16" height="16" rx="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.88;0.90;0.94;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="1122" y="44" width="16" height="16" rx="3.5" fill="#38BDF8">
        <animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.91;0.93;0.96;1" dur="8s" repeatCount="indefinite"/>
      </rect>

      <!-- Exact Snake Path Passing Through the Center (x+8, y+8) of Every Single Green Cell Above -->
      <path d="M 8 30 L 140 30 L 140 8 L 272 8 L 272 74 L 426 74 L 426 30 L 602 30 L 602 52 L 778 52 L 778 8 L 976 8 L 976 52 L 1130 52"
            fill="none" stroke="url(#snakeGlow)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
            pathLength="1000" stroke-dasharray="140 1000">
        <animate attributeName="stroke-dashoffset" values="140;-1000" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>