<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="snakeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Left Card: GitHub Telemetry & Metrics -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="586" height="220" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">📊 GitHub Overview &amp; Agent Telemetry</text>
    <circle cx="552" cy="32" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- 4 Metric Boxes -->
    <g transform="translate(28, 58)">
      <rect x="0" y="0" width="254" height="64" rx="10" fill="#111827" stroke="#1E293B"/>
      <text x="16" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">PUBLIC &amp; PRIVATE REPOS</text>
      <text x="16" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" fill="#38BDF8">19</text>
      <text x="58" y="48" font-family="ui-monospace, monospace" font-size="11" fill="#34D399">Active</text>

      <rect x="274" y="0" width="256" height="64" rx="10" fill="#111827" stroke="#1E293B"/>
      <text x="290" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">SPECIALIZED AI AGENTS</text>
      <text x="290" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" fill="#818CF8">12</text>
      <text x="332" y="48" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">+ 49 Skills</text>

      <rect x="0" y="78" width="254" height="64" rx="10" fill="#111827" stroke="#1E293B"/>
      <text x="16" y="102" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">PRIMARY AI STACK</text>
      <text x="16" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="700" fill="#34D399">Gemini 4 • Claude • R1</text>

      <rect x="274" y="78" width="256" height="64" rx="10" fill="#111827" stroke="#1E293B"/>
      <text x="290" y="102" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">AUTOMATION CLUSTERS</text>
      <text x="290" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="700" fill="#F472B6">n8n • Supabase • Vercel</text>
    </g>
  </g>

  <!-- Right Card: Top Languages Distribution -->
  <g transform="translate(614, 0)">
    <rect x="0" y="0" width="586" height="220" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">💻 Most Used Languages &amp; Runtimes</text>

    <!-- Combined Multi-Segment Progress Bar -->
    <g transform="translate(28, 58)">
      <rect x="0" y="0" width="530" height="14" rx="7" fill="#1E293B"/>
      <rect x="0" y="0" width="212" height="14" rx="7" fill="#3178C6"/>
      <rect x="206" y="0" width="165" height="14" fill="#3572A5"/>
      <rect x="371" y="0" width="90" height="14" fill="#00ADD8"/>
      <rect x="461" y="0" width="69" height="14" rx="7" fill="#10B981"/>
    </g>

    <!-- Language Breakdown Rows -->
    <g transform="translate(28, 98)" font-family="ui-monospace, monospace" font-size="13">
      <circle cx="8" cy="8" r="5" fill="#3178C6"/>
      <text x="24" y="12" fill="#F8FAFC" font-weight="600">TypeScript / Next.js</text>
      <text x="215" y="12" fill="#94A3B8">40%</text>

      <circle cx="288" cy="8" r="5" fill="#3572A5"/>
      <text x="304" y="12" fill="#F8FAFC" font-weight="600">Python / FastAPI / AI</text>
      <text x="492" y="12" fill="#94A3B8">31%</text>

      <circle cx="8" cy="44" r="5" fill="#00ADD8"/>
      <text x="24" y="48" fill="#F8FAFC" font-weight="600">Go (LLM Gateways)</text>
      <text x="215" y="48" fill="#94A3B8">17%</text>

      <circle cx="288" cy="44" r="5" fill="#10B981"/>
      <text x="304" y="48" fill="#F8FAFC" font-weight="600">Shell / Docker / SQL</text>
      <text x="492" y="48" fill="#94A3B8">12%</text>

      <rect x="0" y="72" width="530" height="32" rx="8" fill="#111827" stroke="#1E293B"/>
      <text x="16" y="92" font-size="11.5" fill="#94A3B8">⚡ Focus: Autonomous Coding, Video Generation (Veo/Remotion), Telegram TMA</text>
    </g>
  </g>

  <!-- Bottom Full-Width Animated Contribution Matrix & Snake -->
  <g transform="translate(0, 244)">
    <rect x="0" y="0" width="1200" height="174" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">🐍 Contribution Matrix &amp; Activity Pulse</text>
    <text x="1025" y="34" font-family="ui-monospace, monospace" font-size="11.5" fill="#34D399">● ACTIVE PIPELINE</text>

    <!-- Contribution Grid Background -->
    <g transform="translate(28, 52)">
      <pattern id="cells" width="22" height="22" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="16" height="16" rx="3.5" fill="#111827" stroke="#1E293B" stroke-width="0.8"/>
      </pattern>
      <rect x="0" y="0" width="1144" height="88" fill="url(#cells)"/>

      <!-- Highlighted Green Activity Cells -->
      <rect x="44" y="22" width="16" height="16" rx="3.5" fill="#065F46"/>
      <rect x="88" y="44" width="16" height="16" rx="3.5" fill="#047857"/>
      <rect x="132" y="0" width="16" height="16" rx="3.5" fill="#10B981"/>
      <rect x="176" y="22" width="16" height="16" rx="3.5" fill="#059669"/>
      <rect x="220" y="66" width="16" height="16" rx="3.5" fill="#10B981"/>
      <rect x="286" y="22" width="16" height="16" rx="3.5" fill="#34D399"/>
      <rect x="330" y="44" width="16" height="16" rx="3.5" fill="#059669"/>
      <rect x="396" y="0" width="16" height="16" rx="3.5" fill="#10B981"/>
      <rect x="440" y="22" width="16" height="16" rx="3.5" fill="#34D399"/>
      <rect x="506" y="66" width="16" height="16" rx="3.5" fill="#047857"/>
      <rect x="572" y="22" width="16" height="16" rx="3.5" fill="#10B981"/>
      <rect x="638" y="44" width="16" height="16" rx="3.5" fill="#34D399"/>
      <rect x="704" y="0" width="16" height="16" rx="3.5" fill="#059669"/>
      <rect x="770" y="22" width="16" height="16" rx="3.5" fill="#10B981"/>
      <rect x="836" y="66" width="16" height="16" rx="3.5" fill="#34D399"/>
      <rect x="902" y="44" width="16" height="16" rx="3.5" fill="#10B981"/>
      <rect x="968" y="22" width="16" height="16" rx="3.5" fill="#34D399"/>
      <rect x="1034" y="0" width="16" height="16" rx="3.5" fill="#10B981"/>
      <rect x="1078" y="44" width="16" height="16" rx="3.5" fill="#34D399"/>
      <rect x="1100" y="22" width="16" height="16" rx="3.5" fill="#38BDF8"/>

      <!-- Animated Glowing Snake Path -->
      <path d="M 8 30 L 140 30 L 140 8 L 294 8 L 294 52 L 448 52 L 448 30 L 646 30 L 646 52 L 778 52 L 778 30 L 976 30 L 976 52 L 1108 52 L 1108 30"
            fill="none" stroke="url(#snakeGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="220 1400">
        <animate attributeName="stroke-dashoffset" values="1620;0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>