<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0D111A"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#34D399;#38BDF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#34D399;#38BDF8;#818CF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#38BDF8;#818CF8;#34D399" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Top Status Pill -->
  <g transform="translate(64, 46)">
    <rect x="0" y="0" width="236" height="30" rx="15" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
