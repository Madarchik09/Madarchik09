    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="url(#accent)">AI Automation Engineer • Multi-Agent Workflows • Full-Stack Builder</text>
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5" fill="#94A3B8">Building high-concurrency LLM gateways, autonomous coding &amp; media pipelines (Veo / Seedance / Flow),</text>
